<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هنوز نرسیدیم!</title>

    <!-- Vazirmatn Font -->
    <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Courier New", 'monospace']
                    },
                    
                    
                    
                    
                    colors: {
                        accent: '#00e5ff',
                        accentHover: '#84ffff',
                        darkBg: '#0f0f13',
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Dark Theme & Background Pattern */
        body {
            background-color: #0f0f13;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(0, 229, 255, 0.1) 0%, transparent 60%);
            background-attachment: fixed;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(30, 30, 35, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 229, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        /* Neon Button Styling */
        .btn-neon {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.15);
            transition: all 0.3s ease;
        }
        
        .btn-neon:hover {
            background: rgba(0, 229, 255, 0.2);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.3);
            border-color: #00e5ff;
            transform: scale(1.02);
        }

        .btn-neon:active {
            transform: scale(0.98);
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        /* Floating animation for icon */
        .float-anim {
            animation: floating 3s ease-in-out infinite;
        }
        
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 font-sans antialiased text-white">
    
    <div class="w-full max-w-[420px] fade-in">
        <!-- کادر اصلی گلس‌مورفیسم -->
        <div class="glass-panel rounded-[2.5rem] p-8 sm:p-10 text-center flex flex-col items-center relative overflow-hidden">
            
            <!-- هاله نوری در پس‌زمینه کارت -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-accent/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-accent/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <!-- آیکون ساعت نئونی -->
            <div class="mb-8 mt-2 relative float-anim">
                <div class="absolute inset-0 bg-accent/30 rounded-full blur-xl"></div>
                <div class="relative w-24 h-24 rounded-full flex items-center justify-center border border-accent/40 bg-black/40 shadow-[0_0_20px_rgba(0,229,255,0.2)]">
                    <i class="fa-regular fa-clock text-5xl text-accent"></i>
                </div>
            </div>

            <!-- متن اصلی -->
            <h1 class="text-xl sm:text-2xl font-bold text-white mb-6 leading-[2.2] tracking-wide">
                داداش چقد عجله داری<br>
                <span class="text-accent drop-shadow-[0_0_10px_rgba(0,229,255,0.4)]">صبر کن هنوز نرسیدیم که :)</span>
            </h1>

            <!-- متن توضیحات -->
            <p class="text-gray-300 text-sm sm:text-[15px] leading-relaxed mb-10 px-2">
                این اپیزود هنوز آماده نشده یا سرورش در حال ساخته. یه کم دیگه بهمون فرصت بده، به زودی راه‌اندازی میشه!
            </p>

            <!-- دکمه بازگشت -->
            <a href="../../" 
               class="btn-neon w-full flex items-center justify-center gap-3 px-6 py-4 text-white font-medium text-base rounded-2xl cursor-pointer">
                <span class="whitespace-nowrap">بازگشت به لیست اپیزودها</span>
                <i class="fa-solid fa-arrow-right-long mt-1"></i>
            </a>
            
        </div>
    </div>

</body>
</html>
