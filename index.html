<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پورتال جلسات MCSE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #050b14; /* یک سرمه‌ای بسیار تیره */
            overflow-x: hidden;
        }

        /* انیمیشن برای گوی‌های درخشان پس‌زمینه */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }

        .animation-delay-2000 {
            animation-delay: 2s;
        }
        
        .animation-delay-4000 {
            animation-delay: 4s;
        }

        /* انیمیشن ورود کارت‌ها به صفحه */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .episode-card {
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        /* استایل خاص برای شماره اپیزود - افکت گرادینت */
        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="min-h-screen relative text-slate-200 flex flex-col items-center justify-center py-12 px-4 sm:px-6 lg:px-8">

    <div class="fixed inset-0 w-full h-full overflow-hidden -z-10 flex items-center justify-center pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-cyan-600/30 rounded-full mix-blend-screen filter blur-[100px] animate-blob"></div>
        <div class="absolute top-[20%] left-[-10%] w-96 h-96 bg-blue-600/30 rounded-full mix-blend-screen filter blur-[100px] animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-[500px] h-[500px] bg-purple-600/20 rounded-full mix-blend-screen filter blur-[120px] animate-blob animation-delay-4000"></div>
    </div>

    <div class="max-w-5xl w-full flex flex-col items-center z-10">
        <div class="text-center mb-16 animate-[fadeUp_0.8s_ease-out]">
            <div class="inline-flex items-center justify-center px-4 py-1.5 mb-6 rounded-full border border-cyan-500/30 bg-cyan-500/10 backdrop-blur-md">
                <span class="text-cyan-300 text-sm font-semibold tracking-wider">دسترسی سریع به منابع</span>
            </div>
            <h1 class="text-4xl md:text-6xl font-black mb-4 tracking-tight text-white drop-shadow-lg">
                پورتال جلسات <span class="bg-gradient-to-r from-cyan-400 to-blue-500 text-gradient">MCSE</span>
            </h1>
            <p class="text-slate-400 text-lg md:text-xl font-light max-w-2xl mx-auto">
                جهت ورود به هر بخش، اپیزود مورد نظر خود را از لیست زیر انتخاب کنید.
            </p>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6 w-full" id="episodes-grid">
            <!-- کارت‌ها در اینجا توسط جاوااسکریپت تزریق می‌شوند -->
        </div>
        
        <!-- فوتر کوچک -->
        <div class="mt-16 text-slate-500 text-sm animate-[fadeUp_1s_ease-out]">
            طراحی شده برای یادگیری هوشمندانه و مدرن
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('episodes-grid');
            
            // تنظیمات تعداد اپیزودها (از 1 تا 15 به درخواست شما)
            const startEpisode = 1; 
            const totalEpisodes = 15; 
            
            // ساختار URL
            const baseUrl = './episodes/e';
            const domain = '.html';

            // تولید کارت‌ها
            for (let i = startEpisode; i <= totalEpisodes; i++) {
                const a = document.createElement('a');
                
                // تنظیم لینک
                a.href = `${baseUrl}${i}${domain}`;
                
                // اعمال کلاس‌های تیلویند برای ساختار Glassmorphism و انیمیشن Hover
                a.className = `
                    episode-card group relative overflow-hidden rounded-2xl p-6
                    bg-white/5 backdrop-blur-lg border border-white/10
                    flex flex-col items-center justify-center gap-2
                    transition-all duration-300 ease-out cursor-pointer
                    hover:-translate-y-2 hover:bg-white/10 hover:border-cyan-400/50 
                    hover:shadow-[0_0_30px_rgba(34,211,238,0.2)]
                `;
                
                // ایجاد تاخیر تدریجی در انیمیشن ورود (استایل درون‌خطی)
                a.style.animationDelay = `${i * 0.05}s`; 
                
                // محتوای داخلی کارت (شماره، متن و آیکون فلش)
                a.innerHTML = `
                    <!-- افکت نور پس‌زمینه ظریف هنگام هاور -->
                    <div class="absolute inset-0 bg-gradient-to-b from-transparent to-cyan-500/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                    
                    <span class="text-sm font-medium text-slate-400 group-hover:text-cyan-300 transition-colors z-10">اپیزود</span>
                    
                    <strong class="text-5xl font-black text-white group-hover:text-transparent group-hover:bg-clip-text group-hover:bg-gradient-to-r group-hover:from-cyan-300 group-hover:to-blue-400 transition-all z-10">
                        ${i}
                    </strong>
                    
                    <!-- آیکون ورود که هنگام هاور نمایش داده می‌شود -->
                    <div class="absolute bottom-3 opacity-0 transform translate-y-4 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300 z-10">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-cyan-400">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                            <polyline points="10 17 15 12 10 7"></polyline>
                            <line x1="15" y1="12" x2="3" y2="12"></line>
                        </svg>
                    </div>
                `;
                
                grid.appendChild(a);
            }
        });
    </script>
</body>
</html>
